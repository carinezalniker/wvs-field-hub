    {html:`<div class="hint" style="font-size:13px;color:var(--muted)">Each rep found in the file gets their store list replaced. Rows without a Rep column go to <b>${esc(repName(S.rep))}</b>.</div>`}],
  async v=>{
    const file=v('file');if(!file)throw'Choose a CSV file first.';
    const rows=parseCSV(await file.text());if(rows.length<2)throw'That file has no store rows.';
    const H=rows[0].map(h=>h.trim().toLowerCase());
    const find=names=>H.findIndex(h=>names.includes(h));
    const iS=find(['store','store name','place','place name','name','outlet','outlet name','account name']);
    const iR=find(['retailer','account','chain','group','banner','customer','store type','account type']);
    const iT=find(['town','city','area','suburb','location']);
    const iP=find(['rep','representative','sales rep','assigned rep','assigned to','representative name']);
    if(iS<0)throw'No Store / Name column found in the header row.';
    const bcols=[];H.forEach((h,i)=>{if(i===iS||i===iR||i===iT||i===iP)return;
      const k=h.includes('exso')?'exso':h.includes('south')?'southside':h.includes('lita')?'lita':/\bfix\b/.test(h)?'fix':h.includes('taki')?'takis':h.includes('crack')?'crackfers':null;if(k)bcols.push([i,k])});
    const yes=x=>{x=(x||'').trim().toLowerCase();return x!==''&&!['0','n','no','false','-','none'].includes(x)};
    const matchRep=val=>{const v=(val||'').trim().toLowerCase();if(!v)return null;
      return (S.reps.find(r=>r.name.toLowerCase()===v)||S.reps.find(r=>r.id===v)||S.reps.find(r=>v.includes(r.name.toLowerCase().split(' ')[0])&&r.name.length>2))?.id||null};
    const groups={};let unmatched=0;
    rows.slice(1).forEach(r=>{const n=(r[iS]||'').trim();if(!n)return;
      const rep=iP>=0?matchRep(r[iP]):S.rep;if(!rep){unmatched++;return}
      const s={n};if(iR>=0&&r[iR]?.trim())s.r=r[iR].trim();if(iT>=0&&r[iT]?.trim())s.t=r[iT].trim();
      const b=[...new Set(bcols.filter(([i])=>yes(r[i])).map(([,k])=>k))];if(b.length)s.b=b;
      (groups[rep]=groups[rep]||[]).push(s)});
    const ids=Object.keys(groups);if(!ids.length)throw unmatched?`None of the ${unmatched} rows matched a rep in the Team list.`:'No stores found.';
    for(const id of ids){await S.db.doc('storelists/'+id).set({stores:groups[id],updatedAt:new Date().toISOString(),source:file.name})}
    toast(`Loaded ${ids.map(id=>`${repName(id).split(' ')[0]} ${groups[id].length}`).join(', ')}${unmatched?` · ${unmatched} rows skipped (no matching rep)`:''}`);
  },'Import');
}

function openTeam(){
  const f=$('#dlgForm');const d=$('#dlg');
  const draw=()=>{f.innerHTML=`<h2>Team &amp; codes</h2>
    <div class="hint" style="font-size:13px;color:var(--muted)">Each rep opens the same hub link and types their code. The code locks the hub to their route until they sign out.</div>
    <div class="teamlist">${S.reps.map(r=>`<div><span><b>${esc(r.name)}</b><br><span style="color:var(--muted);font-size:13px">${r.region?esc(RMAP[r.region]||r.region)+' · ':''}${esc(r.territory||'')}</span></span>
      <span class="pinrow"><input type="text" inputmode="numeric" data-pin="${esc(r.id)}" value="${esc(pinOf(r))}" placeholder="no code" aria-label="Access code for ${esc(r.name)}">
      <button type="button" class="btn small" data-savepin="${esc(r.id)}">Save</button>
      <button type="button" class="btn ghost small" data-copypin="${esc(r.id)}">Copy</button>
      <button type="button" class="btn ghost small" data-rm="${esc(r.id)}">Remove</button></span></div>`).join('')||'<div>No reps yet</div>'}</div>
    ${S.reps.some(r=>!pinOf(r))?`<button type="button" class="btn" id="genPins">Give everyone a code</button>`:''}
    <div class="teamlist"><div><span><b>Manager code</b><br><span style="color:var(--muted);font-size:13px">Opens every rep, the Overview and team sales, without editing</span></span>
      <span class="pinrow"><input type="text" inputmode="numeric" id="mgrPin" value="${esc(S.mgrCode)}" placeholder="no code" aria-label="Manager code"><button type="button" class="btn small" id="saveMgr">Save</button></span></div></div>
    <div class="row2"><div class="fld"><label for="nrName">Name</label><input type="text" id="nrName"></div><div class="fld"><label for="nrTer">Territory</label><input type="text" id="nrTer"></div></div>
    <div class="fld"><label for="nrReg">Region (decides which order forms they see)</label><select id="nrReg"><option value="">All regions</option>${REGIONS.map(r=>`<option value="${r.k}">${esc(r.n)}</option>`).join('')}</select></div>
    <div class="err" id="fErr" hidden></div><div class="dlgact"><button type="button" class="btn" id="tClose">Done</button><button type="submit" class="btn primary">Add rep</button></div>`;
    $('#tClose').onclick=()=>d.close();
    f.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='Confirm';return}
      try{await S.db.doc('reps/'+b.dataset.rm).delete();S.reps=S.reps.filter(r=>r.id!==b.dataset.rm);draw()}catch(e){toast(errMsg(e))}});
    const savePin=async(id,val)=>{
      const pin=String(val||'').trim();
      if(pin&&S.reps.some(r=>r.id!==id&&pinOf(r)===pin)){toast('Another rep already has that code.');return false}
      try{await S.db.doc('reps/'+id).update({pin});const r=S.reps.find(x=>x.id===id);if(r)r.pin=pin;return true}
      catch(e){toast(errMsg(e));return false}
    };
    f.querySelectorAll('[data-savepin]').forEach(b=>b.onclick=async()=>{
      const id=b.dataset.savepin;const inp=f.querySelector(`[data-pin="${CSS.escape(id)}"]`);
      if(await savePin(id,inp.value)){toast(`Code saved for ${repName(id)}`);draw()}});
    f.querySelectorAll('[data-copypin]').forEach(b=>b.onclick=async()=>{
      const inp=f.querySelector(`[data-pin="${CSS.escape(b.dataset.copypin)}"]`);
      const v=inp.value.trim();if(!v){toast('No code to copy yet.');return}
      try{await navigator.clipboard.writeText(v);toast('Code copied')}catch(e){inp.select();toast('Press copy to take the code')}});
    const sm=$('#saveMgr');
    if(sm)sm.onclick=async()=>{const v=$('#mgrPin').value.trim();
      if(v&&S.reps.some(r=>pinOf(r)===v)){toast('A rep already has that code.');return}
      try{await S.db.doc('settings/access').set({managerCode:v,updatedAt:new Date().toISOString()});S.mgrCode=v;toast(v?'Manager code saved':'Manager code removed')}catch(e){toast(errMsg(e))}};
    const gp=$('#genPins');
    if(gp)gp.onclick=async()=>{
      gp.disabled=true;
      const taken=new Set(S.reps.map(pinOf).filter(Boolean));
      for(const r of S.reps){
        if(pinOf(r))continue;
        let p;do{p=String(Math.floor(1000+Math.random()*9000))}while(taken.has(p));
        taken.add(p);await savePin(r.id,p);
      }
      draw();toast('Codes created');
    };
  };
  f.onsubmit=async e=>{e.preventDefault();const n=$('#nrName').value.trim();if(!n)return;const id=slug(n);
    const reg=$('#nrReg').value;
    try{await S.db.doc('reps/'+id).set({name:n,territory:$('#nrTer').value.trim(),region:reg,order:S.reps.length+1});if(!S.reps.some(r=>r.id===id))S.reps.push({id,name:n,territory:$('#nrTer').value.trim(),region:reg});draw()}catch(err){toast(errMsg(err))}};
  draw();d.showModal();
}

/* ---------- rep + tab state ---------- */
function fillReps(){
  const sel=$('#rep');
  if(!S.reps.length){sel.innerHTML='<option value="">No reps yet</option>';return}
  if(!S.rep||!S.reps.some(r=>r.id===S.rep)){const saved=ls.get('fh.rep');S.rep=S.reps.some(r=>r.id===saved)?saved:S.reps[0].id;subStores()}
  if(canAll()&&ls.get('fh.rep')===ALL&&!S.lockRep)S.allMode=true;
  if(!canAll())S.allMode=false;
  sel.innerHTML=(canAll()?`<option value="${ALL}" ${S.allMode?'selected':''}>All reps</option>`:'')
    +S.reps.map(r=>`<option value="${esc(r.id)}" ${!S.allMode&&r.id===S.rep?'selected':''}>${esc(r.name)}</option>`).join('');
}
function setAllMode(on){
  if(on&&!canAll())return;
  S.allMode=!!on;
  S.storeQ='';S.storeRet='';S.storeBrand='';S.ordQ='';S.ordOpen.clear();S.ordMore=false;
  S.actQ='';S.actWho='';S.actAll=false;S.actOpen.clear();
  ls.set('fh.rep',on?ALL:S.rep);
  fillReps();render(true);
}
/* ---------- access codes ---------- */
const pinOf=r=>String(r&&r.pin||'').trim();
const anyPins=()=>S.reps.some(pinOf);
function repForCode(code){
  code=String(code||'').trim();
  if(!code)return null;
  if(S.mgrCode&&code===S.mgrCode)return '__mgr';
  const r=S.reps.find(x=>pinOf(x)&&pinOf(x)===code);
  return r?r.id:null;
}
function showChrome(){
  const locked=!!S.lockRep&&!S.admin&&!S.mgr;
  $('#rep').hidden=locked;$('#repLbl').hidden=locked;
  $('#whoAmI').hidden=!(locked||(S.mgr&&!S.admin));
  if(locked)$('#whoAmI').textContent=repName(S.rep);else if(S.mgr&&!S.admin)$('#whoAmI').textContent='Manager view';
  $('#outBtn').hidden=!(locked||(S.mgr&&!S.admin));
  $('#ovTab').hidden=!(S.admin||S.mgr);
  $('#mkTab').hidden=!(S.admin||S.mgr);
}
function applyLock(){
  if(!S.db||S.admin||!(S.loaded.reps||S.readFail)){S.locked=false;$('#lock').hidden=true;showChrome();return}
  let id=S.lockRep;
  if(!id){
    let code='';
    try{code=new URLSearchParams(location.search).get('k')||''}catch(e){}
    if(!code&&location.hash.startsWith('#k-'))code=decodeURIComponent(location.hash.slice(3));
    if(code){const m=repForCode(code);if(m){id=m;ls.set('fh.unlock',code);if(location.hash.startsWith('#k-'))location.hash='#today'}}
  }
  if(!id)id=repForCode(S.unlockCode||ls.get('fh.unlock'));
  if(id==='__mgr'){
    S.mgr=true;S.locked=false;S.lockRep=null;S.allMode=true;
    $('#lock').hidden=true;startMgrSubs();fillReps();showChrome();
    if(!location.hash||location.hash==='#today'){S.tab='overview';}
    return;
  }
  if(id){
    S.locked=false;S.lockRep=id;S.rep=id;ls.set('fh.rep',id);
    $('#lock').hidden=true;showChrome();
    if(S._subRep!==id)subStores();
  }else{S.locked=true;$('#lock').hidden=false}
}
$('#lockForm').onsubmit=e=>{
  e.preventDefault();
  const v=$('#lockPin').value.trim();
  const id=repForCode(v);
  if(!id){$('#lockErr').textContent="That code isn't right. Check with your manager.";return}
  S.unlockCode=v;ls.set('fh.unlock',v);if(id!=='__mgr')S.lockRep=id;$('#lockErr').textContent='';
  applyLock();render();
};
$('#outBtn').onclick=async()=>{ls.set('fh.unlock','');S.lockRep=null;S.mgr=false;
  try{if(firebase.auth().currentUser&&!firebase.auth().currentUser.isAnonymous)await firebase.auth().signOut()}catch(e){}
  location.reload()};

function startMgrSubs(){
  if(S.mgrSubs||!S.db)return;S.mgrSubs=true;const db=S.db;
  db.collection('storelists').onSnapshot(s=>{S.allStores=Object.fromEntries(s.docs.filter(d=>d.id!=='unassigned').map(d=>[d.id,d.data()]));render()},()=>{});
  db.collection('orders').onSnapshot(s=>{S.allOrders=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));render()},()=>{});
  db.doc('salesteam/summary').onSnapshot(s=>{S.team=s.exists?s.data():null;render()},()=>{});
  db.doc('marketing/budgets').onSnapshot(s=>{S.mkBud=s.exists?s.data():null;render()},()=>{});
  db.doc('marketing/sheet').onSnapshot(s=>{S.mkSheet=s.exists?s.data():null;render()},()=>{});
  db.collection('mkspend').onSnapshot(s=>{S.mkSpend=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
  db.collection('callcycles').onSnapshot(s=>{S.allCC=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));render()},()=>{});
  if(!S._allActSub){S._allActSub=true;
    db.collection('activations').onSnapshot(s=>{S.allAct=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));render()},()=>{});}
}
function openRep(id,tab){
  if(!S.reps.some(r=>r.id===id))return;
  S.allMode=false;S.rep=id;ls.set('fh.rep',id);fillReps();S.storeQ='';S.storeRet='';S.storeBrand='';S.ordQ='';S.ordOpen.clear();S.ordMore=false;S.actWho=(S.admin||S.mgr)?'me':'';S.actQ='';S.actAll=false;
  subStores();fillReps();
  const t=tab||'today';if(location.hash==='#'+t){readHash();render()}else location.hash='#'+t;
  window.scrollTo(0,0);
}
let unStores=null,unOrders=null;
function subStores(){
  if(unStores){unStores();unStores=null}
  if(unOrders){unOrders();unOrders=null}
  S.stores=null;S.orders=null;S._subRep=S.rep;if(!S.db||!S.rep)return;
  unStores=S.db.doc('storelists/'+S.rep).onSnapshot(s=>{S.stores=s.exists?s.data():null;render()},()=>{});
  unOrders=S.db.doc('orders/'+S.rep).onSnapshot(s=>{S.orders=s.exists?s.data():{orders:[]};render()},()=>{});
  subSales();
  subAct();
  subCC();
}
let unCC=null;
function subCC(){
  if(unCC){unCC();unCC=null}
  S.cc=null;S.ccLoaded=false;S.ccWeek=null;S.ccQ='';S.ccAll=false;
  if(!S.db||!S.rep)return;
  unCC=S.db.doc('callcycles/'+S.rep).onSnapshot(s=>{S.cc=s.exists?s.data():null;S.ccLoaded=true;render()},()=>{S.ccLoaded=true;render()});
}
let unAct=null;
function subAct(){
  const rg=repRegion();
  if(S.actReg===rg&&unAct)return;
  if(unAct){unAct();unAct=null}
  S.act=null;S.actLoaded=false;S.actReg=rg;if(!S.db||!rg)return;
  unAct=S.db.doc('activations/'+rg).onSnapshot(s=>{S.act=s.exists?s.data():null;S.actLoaded=true;render()},()=>{S.actLoaded=true;render()});
}
let unSales=null;
function subSales(){
  if(unSales){unSales();unSales=null}
  S.sales=null;S.salesLoaded=false;if(!S.db||!S.rep)return;
  unSales=S.db.doc('sales/'+S.rep).onSnapshot(s=>{S.sales=s.exists?s.data():null;S.salesLoaded=true;render()},()=>{S.salesLoaded=true;render()});
}
$('#rep').onchange=e=>{
  if(e.target.value===ALL){setAllMode(true);return}
  S.allMode=false;S.rep=e.target.value;ls.set('fh.rep',S.rep);
  S.storeQ='';S.storeRet='';S.storeBrand='';S.ordQ='';S.ordOpen.clear();S.ordMore=false;S.actWho=canAll()?'me':'';S.actQ='';S.actAll=false;
  subStores();render()};
$('#teamBtn').onclick=openTeam;
$('#mgrToggle').onclick=()=>{$('#mgrForm').hidden=false;$('#mgrToggle').hidden=true;$('#lockForm').hidden=true;$('#lockErr').textContent='';$('#mgrEmail').focus()};
$('#mgrBack').onclick=()=>{$('#mgrForm').hidden=true;$('#mgrToggle').hidden=false;$('#lockForm').hidden=false;$('#lockErr').textContent=''};
$('#mgrForm').onsubmit=async e=>{
  e.preventDefault();
  const btn=$('#mgrForm button[type=submit]'),em=$('#mgrEmail').value.trim(),pw=$('#mgrPass').value;
  if(!em||!pw){$('#lockErr').textContent='Enter your email and password.';return}
  btn.disabled=true;$('#lockErr').textContent='';
  try{await firebase.auth().signInWithEmailAndPassword(em,pw)}
  catch(err){
    const c=String(err&&err.code||'');
    $('#lockErr').textContent=/wrong-password|user-not-found|invalid-cred|invalid-email/.test(c)?"That email and password don't match an account."
      :/too-many-requests/.test(c)?'Too many tries. Wait a minute and try again.':'Could not sign in. '+errMsg(err);
    btn.disabled=false;
  }
};
document.addEventListener('click',e=>{if(e.target.closest('#runImport'))runImport()});
$('#main').addEventListener('focusout',()=>setTimeout(()=>{if(!S.pending)return;const a=document.activeElement;if(a&&$('#main').contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=='checkbox')return;render()},0));
function readHash(){const h=(location.hash||'').slice(1);S.tab=['overview','today','brands','stores','callcycle','orders','activations','promos','sales','marketing','import'].includes(h)?h:'today'}
window.addEventListener('hashchange',()=>{readHash();render();window.scrollTo(0,0)});
readHash();render();

/* ---------- one-time import ---------- */
function viewImport(){
  if(!S.admin) return `<section class="panel"><div class="ph"><h2>Import data</h2></div><div class="pb"><div class="empty">Managers only. Sign in with your email to run the import.</div></div></section>`;
  const counts=S.impCounts||null;
  return `<section class="panel"><div class="ph"><h2>One-time data import</h2><span class="meta">Loads the hub's starting data into Firestore</span></div><div class="pb">
    <p style="margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.5">This reads <code>data/bundle.json</code> and writes every document into the database. Run it once, when the database is empty. Running it again overwrites documents that share an ID, which is safe but will undo any edits made since.</p>
    ${counts?`<div style="margin-bottom:14px">${Object.entries(counts).map(([k,n])=>`<div class="improw"><span class="c">${esc(k)}</span><span>${n} document${n===1?'':'s'}</span></div>`).join('')}</div>`:''}
    <button class="btn primary" id="runImport"${S.impBusy?' disabled':''}>${S.impBusy?'Importing…':'Run the import'}</button>
    <div style="margin-top:12px;font-size:14px;color:var(--muted);min-height:20px" role="status">${esc(S.impMsg||'')}</div>
  </div></section>`;
}
async function runImport(){
  if(S.impBusy)return; S.impBusy=true; S.impMsg='Reading data/bundle.json…'; render();
  try{
    const r=await fetch('data/bundle.json',{cache:'no-store'});
    if(!r.ok)throw'Could not read data/bundle.json ('+r.status+').';
    const bundle=await r.json();
    const jobs=[];
    for(const [coll,docs] of Object.entries(bundle))
      for(const [id,data] of Object.entries(docs||{})) jobs.push([coll,id,data]);
    S.impCounts=Object.fromEntries(Object.entries(bundle).map(([k,v])=>[k,Object.keys(v||{}).length]));
    let done=0;
    for(let i=0;i<jobs.length;i+=100){
      const batch=S.db.batch();
      for(const [coll,id,data] of jobs.slice(i,i+100)) batch.set(S.db.collection(coll).doc(id),data);
      await batch.commit(); done+=Math.min(100,jobs.length-i);
      S.impMsg=`Written ${done} of ${jobs.length} documents…`; render();
    }
    S.impMsg=`Done — ${jobs.length} documents written. The hub is live.`;
  }catch(e){S.impMsg='Import failed: '+errMsg(e)}
  S.impBusy=false; render();
}

/* ---------- data ---------- */
function startSubs(){
  if(S._subs)return; S._subs=true; const db=S.db;
  const docs=s=>s.docs.map(d=>({id:d.id,...d.data()}));
  db.collection('reps').onSnapshot(s=>{S.reps=docs(s).sort((a,b)=>(a.order||99)-(b.order||99)||a.name.localeCompare(b.name));S.loaded.reps=true;fillReps();applyLock();if(S.rep)subAct();render()},()=>{});
  db.doc('settings/access').onSnapshot(s=>{S.mgrCode=String((s.exists&&s.data().managerCode)||'').trim();if(S.loaded.reps){applyLock();render()}},()=>{});
  if(S.admin)startMgrSubs();
  db.collection('files').onSnapshot(s=>{S.files=docs(s);render()},()=>{});
  db.collection('promos').onSnapshot(s=>{S.promos=docs(s).filter(p=>!p.hidden);render()},()=>{});
  db.collection('priorities').onSnapshot(s=>{S.priorities=docs(s);render()},()=>{});
  db.collection('tasks').onSnapshot(s=>{S.tasks=docs(s);render()},()=>{});
  db.doc('storelists/unassigned').onSnapshot(s=>{S.pool=s.exists?s.data():null;render()},()=>{});
  db.collection('claims').onSnapshot(s=>{S.claims=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));render()},()=>{});
  db.collection('brands').onSnapshot(s=>{S.brandInfo=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));render()},()=>{});
  render();
}
(async()=>{
  if(typeof firebase==='undefined'||!window.FB_CONFIG||!window.FB_CONFIG.apiKey){
    S.bootErr="This hub isn't configured yet — firebase-config.js is missing its project details.";
    S.locked=false;showChrome();render();return;
  }
  firebase.initializeApp(window.FB_CONFIG);
  S.db=firebase.firestore();
  S.write=true;
  firebase.auth().onAuthStateChanged(u=>{
    if(!u){firebase.auth().signInAnonymously().catch(e=>{S.bootErr='Could not connect to the database. '+errMsg(e);render()});return}
    const wasAdmin=S.admin;
    S.admin=!u.isAnonymous;
    if(S.admin){S.mgr=false;S.lockRep=null;S.locked=false;$('#lock').hidden=true;startMgrSubs();if(!S.allMode)setAllMode(true)}
    startSubs();
    if(!S._failTimer)S._failTimer=setTimeout(()=>{if(!S.loaded.reps&&!S.admin){S.readFail=true;applyLock();render()}},4000);
    if(S.loaded.reps||S.readFail)applyLock();
    showChrome();
    if(S.admin&&!wasAdmin&&(!location.hash||location.hash==='#today'))S.tab='overview';
    render();
  });
})();
</script>
